  <rect width="1280" height="640" rx="32" fill="url(#bg)"/>
  <circle cx="1090" cy="120" r="140" fill="#60A5FA" fill-opacity="0.14"/>
  <circle cx="186" cy="560" r="120" fill="#93C5FD" fill-opacity="0.14"/>
  <rect x="80" y="88" width="520" height="64" rx="32" fill="#DBEAFE" fill-opacity="0.14"/>
  <text x="112" y="130" fill="#BFDBFE" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">GitHub Skills course</text>
  <text x="80" y="252" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">Introduction to GitHub</text>
  <text x="80" y="316" fill="#DBEAFE" font-family="Arial, Helvetica, sans-serif" font-size="32">Learn branches, commits, pull requests, and merges.</text>
  <text x="80" y="396" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="28">Practice the full contribution flow in a guided repository.</text>
