<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Introduction to GitHub course header</title>
  <desc id="desc">A banner with the Introduction to GitHub title and a branching diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="64" x2="1200" y2="576" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="card" x1="820" y1="124" x2="1120" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
