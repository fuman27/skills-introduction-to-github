<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Introduction to GitHub course banner</title>
  <desc id="desc">A simple banner with a dark background and GitHub-themed accent cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />
  <rect x="96" y="84" width="1088" height="472" rx="24" fill="#1f2937" opacity="0.5" />
  <rect x="128" y="120" width="512" height="48" rx="12" fill="url(#accent)" />
  <rect x="128" y="190" width="420" height="26" rx="8" fill="#8b949e" />
  <rect x="128" y="232" width="360" height="26" rx="8" fill="#8b949e" />

  <rect x="760" y="160" width="392" height="120" rx="16" fill="#0d1117" stroke="#30363d" />
  <rect x="792" y="194" width="186" height="18" rx="6" fill="#58a6ff" />
  <rect x="792" y="224" width="320" height="16" rx="6" fill="#6e7681" />

  <rect x="760" y="306" width="392" height="120" rx="16" fill="#0d1117" stroke="#30363d" />
  <rect x="792" y="340" width="220" height="18" rx="6" fill="#3fb950" />
  <rect x="792" y="370" width="286" height="16" rx="6" fill="#6e7681" />

  <text x="128" y="154" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#f0f6fc">
    Introduction to GitHub
  </text>
  <text x="128" y="292" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9d1d9">
    Learn branches, commits, pull requests, and merges.
  </text>
</svg>
