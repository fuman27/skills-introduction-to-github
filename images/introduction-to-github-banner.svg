<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Introduction to GitHub</title>
  <desc id="desc">Banner for the GitHub Skills Introduction to GitHub course.</desc>
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0d1117" />
  <rect x="48" y="48" width="1184" height="544" rx="32" fill="url(#cardGradient)" stroke="#30363d" stroke-width="2" />

  <circle cx="1008" cy="188" r="16" fill="#56d364" />
  <circle cx="1008" cy="320" r="16" fill="#56d364" />
  <circle cx="1128" cy="320" r="16" fill="#56d364" />
  <path d="M1008 204 V304 M1024 320 H1112" fill="none" stroke="#56d364" stroke-width="8" stroke-linecap="round" />

  <rect x="120" y="132" width="180" height="40" rx="20" fill="#1f6feb" opacity="0.18" />
  <text x="210" y="158" fill="#79c0ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">GitHub Skills</text>

  <text x="120" y="262" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="700">Introduction to GitHub</text>
  <text x="120" y="320" fill="#c9d1d9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">Learn repositories, branches, commits, and pull requests.</text>

  <rect x="120" y="372" width="428" height="14" rx="7" fill="url(#accentGradient)" />

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">
    <rect x="120" y="446" width="210" height="56" rx="28" fill="#21262d" />
    <text x="225" y="481" fill="#f0f6fc" text-anchor="middle">Create a branch</text>

    <rect x="350" y="446" width="220" height="56" rx="28" fill="#21262d" />
    <text x="460" y="481" fill="#f0f6fc" text-anchor="middle">Commit a file</text>

    <rect x="590" y="446" width="286" height="56" rx="28" fill="#21262d" />
    <text x="733" y="481" fill="#f0f6fc" text-anchor="middle">Open a pull request</text>

    <rect x="896" y="446" width="264" height="56" rx="28" fill="#21262d" />
    <text x="1028" y="481" fill="#f0f6fc" text-anchor="middle">Merge your changes</text>
  </g>
</svg>
